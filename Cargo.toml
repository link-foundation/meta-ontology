[package]
name = "meta-ontology"
version = "0.8.0"
edition = "2021"
description = "A self-describing meta-ontology stored in Links Notation: library, CLI, microservice, and WASM/React web app (public domain)."
readme = "README.md"
license = "Unlicense"
keywords = ["ontology", "lino", "links-notation", "meta-ontology", "nsm"]
categories = ["data-structures", "command-line-utilities", "science"]
repository = "https://github.com/link-foundation/meta-ontology"
documentation = "https://github.com/link-foundation/meta-ontology"
rust-version = "1.70"

[lib]
name = "meta_ontology"
path = "src/lib.rs"

[[bin]]
name = "meta-ontology"
path = "src/main.rs"

[dependencies]
links-notation = "0.13"
lino-arguments = "0.3"
clap = { version = "4.4", features = ["derive", "env"] }
walkdir = "2.5"
thiserror = "2"

[dev-dependencies]
regex = "1"
tempfile = "3"

[features]
default = []
# Optional encoding/decoding via lino-objects-codec. The crate isn't yet on
# crates.io so it stays a feature flag; enable when shipping the microservice
# (M3) or web app (M4).
codec = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
